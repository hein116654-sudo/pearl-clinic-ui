<div class="card p-4">

    <h2>{{ isEditMode() ? 'Edit Patient' : 'Add New Patient' }}</h2>

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        
        <!-- Personal Information Section -->
        <div class="border-b pb-3 mb-2">
            <h4 class="font-semibold text-lg text-primary mb-3">1. Personal Information</h4>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Full Name -->
                <div class="flex flex-col gap-2">
                    <label for="name" class="font-medium">Full Name <span class="text-red-500">*</span></label>
                    <input pInputText id="name" [(ngModel)]="patient.name" name="name" placeholder="e.g. John Doe" required />
                </div>

                <!-- Date of Birth -->
                <div class="flex flex-col gap-2">
                    <label for="dob" class="font-medium">Date of Birth <span class="text-red-500">*</span></label>
                    <p-datepicker id="dob" [(ngModel)]="patient.dateOfBirth" name="dateOfBirth" [showIcon]="true" dateFormat="yy-mm-dd" placeholder="Select DOB"></p-datepicker>
                </div>

                <!-- Gender -->
                <div class="flex flex-col gap-2">
                    <label for="gender" class="font-medium">Gender <span class="text-red-500">*</span></label>
                    <p-select id="gender" [options]="genderOptions" [(ngModel)]="patient.gender" name="gender" optionLabel="label" optionValue="value" placeholder="Select Gender"></p-select>
                </div>

                <!-- Medical Record No (Optional / Auto-generated) -->
                <div class="flex flex-col gap-2">
                    <label for="mrn" class="font-medium">Medical Record No.</label>
                    <input pInputText id="mrn" [(ngModel)]="patient.medicalRecordNo" name="medicalRecordNumber" placeholder="e.g. MRN-10023" />
                </div>
            </div>
        </div>

        <!-- Contact Information Section -->
        <div class="border-b pb-3 mb-2">
            <h4 class="font-semibold text-lg text-primary mb-3">2. Contact Details</h4>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Phone -->
                <div class="flex flex-col gap-2">
                    <label for="phone" class="font-medium">Phone Number <span class="text-red-500">*</span></label>
                    <input pInputText id="phone" [(ngModel)]="patient.phoneNo" name="phoneNo" placeholder="09xxxxxxxxx" required />
                </div>

                <!-- Email -->
                <div class="flex flex-col gap-2">
                    <label for="email" class="font-medium">Email Address</label>
                    <input pInputText id="email" type="email" [(ngModel)]="patient.email" name="email" placeholder="example@mail.com" />
                </div>

                <!-- Address -->
                <div class="flex flex-col gap-2 md:col-span-2">
                    <label for="address" class="font-medium">Address</label>
                    <textarea pTextarea id="address" [(ngModel)]="patient.address" name="address" rows="2" placeholder="Full residential address"></textarea>
                </div>
            </div>
        </div>

        <!-- Emergency Contact Section -->
        <div>
            <h4 class="font-semibold text-lg text-primary mb-3">3. Emergency Contact</h4>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Emergency Name -->
                <div class="flex flex-col gap-2">
                    <label for="emergencyName" class="font-medium">Contact Person Name</label>
                    <input pInputText id="emergencyName" [(ngModel)]="patient.emergencyContactName" name="emergencyContactName" placeholder="e.g. U Ba" />
                </div>

                <!-- Emergency Phone -->
                <div class="flex flex-col gap-2">
                    <label for="emergencyPhone" class="font-medium">Contact Person Phone</label>
                    <input pInputText id="emergencyPhone" [(ngModel)]="patient.emergencyContactPhone" name="emergencyContactPhone" placeholder="09xxxxxxxxx" />
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end gap-3 mt-4">
            <p-button label="Cancel" severity="secondary" icon="pi pi-times" (onClick)="goBack()"></p-button>
            <p-button [label]="isEditMode() ? 'Update Patient' : 'Save Patient'" icon="pi pi-check" [loading]="isLoading()" type="submit"></p-button>
        </div>

    </form>
</div>
