<p-button label="Add Practitioner" icon="pi pi-plus" (onClick)="openNew()">
</p-button>


<!-- ================================= -->
<!-- Practitioner Table -->
<!-- ================================= -->

<p-table #dt [value]="practitioners()" [loading]="loading()" [paginator]="true" [rows]="10"
  [rowsPerPageOptions]="[5, 10, 20]" [globalFilterFields]="[
    'name',
    'licenseNumber',
    'email',
    'phone',
    'status',
    'specializationName'
  ]" responsiveLayout="scroll">


  <!-- Table Caption -->

  <ng-template pTemplate="caption">

    <div class="table-header">

      <div class="table-title">
        Practitioner List
      </div>

      <input pInputText type="text" placeholder="Search practitioner..." (input)="
          dt.filterGlobal(
            $any($event.target).value,
            'contains'
          )
        " />

    </div>

  </ng-template>


  <!-- Table Header -->

  <ng-template pTemplate="header">

    <tr>
      <th>No</th>

      <th>License Number</th>

      <th>Name</th>

      <th>Specialization</th>

      <th>Email</th>

      <th>Phone</th>

      <th>Status</th>

      <th style="width: 150px;">
        Actions
      </th>

    </tr>

  </ng-template>


  <!-- Table Body -->

  <ng-template pTemplate="body" let-practitioner let-i="rowIndex">

    <tr>
      <td>
        {{i+1}}
      </td>



      <td>
        {{ practitioner.licenseNumber }}
      </td>

      <td>
        <strong>
          {{ practitioner.name }}
        </strong>
      </td>

      <!-- Specialization Name Only -->

      <td>
        {{ practitioner.specializationName }}
      </td>

      <td>
        {{ practitioner.email }}
      </td>

      <td>
        {{ practitioner.phone }}
      </td>

      <td>

        <p-tag [value]="practitioner.status" [severity]="
            practitioner.status === 'ACTIVE'
              ? 'success'
              : 'danger'
          ">
        </p-tag>

      </td>

      <td>

        <div class="action-buttons">

          <p-button icon="pi pi-pencil" [text]="true" severity="info" pTooltip="Edit Practitioner"
            (onClick)="editPractitioner(practitioner)">
          </p-button>

          <p-button icon="pi pi-trash" [text]="true" severity="danger" pTooltip="Delete Practitioner"
            (onClick)="deletePractitioner(practitioner)">
          </p-button>

        </div>

      </td>

    </tr>

  </ng-template>


  <!-- Empty Message -->

  <ng-template pTemplate="emptymessage">

    <tr>

      <td colspan="7" class="empty-message">

        No practitioners found.

      </td>

    </tr>

  </ng-template>

</p-table>


<!-- ================================= -->
<!-- Add / Edit Dialog -->
<!-- ================================= -->

<p-dialog [(visible)]="practitionerDialog" [modal]="true" [draggable]="false" [resizable]="false"
  [style]="{ width: '550px' }" [header]="
    isEditMode
      ? 'Edit Practitioner'
      : 'Add Practitioner'
  ">


  <!-- Name -->

  <div class="form-field">

    <label for="name">
      Name
    </label>

    <input id="name" pInputText type="text" [(ngModel)]="practitioner.name" placeholder="Enter practitioner name" />

  </div>


  <!-- License Number -->

  <div class="form-field">

    <label for="licenseNumber">
      License Number
    </label>

    <input id="licenseNumber" pInputText type="text" [(ngModel)]="practitioner.licenseNumber"
      placeholder="Enter license number" />

  </div>


  <!-- Email -->

  <div class="form-field">

    <label for="email">
      Email
    </label>

    <input id="email" pInputText type="email" [(ngModel)]="practitioner.email" placeholder="Enter email address" />

  </div>


  <!-- Phone -->

  <div class="form-field">

    <label for="phone">
      Phone
    </label>

    <input id="phone" pInputText type="text" [(ngModel)]="practitioner.phone" placeholder="Enter phone number" />

  </div>


  <!-- ================================= -->
  <!-- Specialization -->
  <!-- ================================= -->

  <div class="form-field">

    <label for="specialization">
      Specialization
    </label>

    <p-select id="specialization" [options]="specializations()" [(ngModel)]="selectedSpecializationId"
      optionLabel="name" optionValue="id" placeholder="Select specialization" [style]="{
        width: '100%'
      }">
    </p-select>

  </div>


  <!-- Status -->

  <div class="form-field">

    <label for="status">
      Status
    </label>

    <p-select id="status" [options]="[
        {
          label: 'Active',
          value: 'ACTIVE'
        },
        {
          label: 'Inactive',
          value: 'INACTIVE'
        },
        {
          label:'Retired',
          value:'RETIRED'
        }
      ]" [(ngModel)]="practitioner.status" optionLabel="label" optionValue="value" placeholder="Select status" [style]="{
        width: '100%'
      }">
    </p-select>

  </div>


  <!-- Dialog Footer -->

  <ng-template pTemplate="footer">

    <p-button label="Cancel" icon="pi pi-times" severity="secondary" [text]="true" (onClick)="
        practitionerDialog = false
      ">
    </p-button>


    <p-button [label]="
        isEditMode
          ? 'Update'
          : 'Save'
      " icon="pi pi-check" (onClick)="savePractitioner()">
    </p-button>

  </ng-template>

</p-dialog>
